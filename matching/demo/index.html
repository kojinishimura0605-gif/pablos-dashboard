const DEMO_PHOTOS = {};
function demoClient(){
  const listeners = [];
  let curSession = null;
  function tbl(name){ return DB[name] || (DB[name] = []); }
  function joinApps(rows){
    return rows.map(a=>Object.assign({}, a, {
      fromP: tbl("mk_profiles").find(p=>p.id===a.from_id) || (a.from_id===DEMO_UID?{id:DEMO_UID,name:"あなた（デモ）",rank:DEMO_ME.rank}:null),
      toP: tbl("mk_profiles").find(p=>p.id===a.to_id) || (a.to_id===DEMO_UID?{id:DEMO_UID,name:"あなた（デモ）",rank:DEMO_ME.rank}:null)
    }));
  }
  function qb(name){
    const st = {filters:[], ord:null, lim:null, one:null, head:false, count:false, joins:false, op:null};
    function run(){
      const rows = tbl(name);
      if(st.op){
        if(st.op.type==="insert"){ const r = Object.assign({id:"demo-"+Math.random().toString(36).slice(2,9), created_at:new Date().toISOString()}, st.op.row); rows.push(r); return {data:r, error:null}; }
        if(st.op.type==="update"){ rows.filter(r=>st.filters.every(f=>f(r))).forEach(r=>Object.assign(r, st.op.patch)); return {data:null, error:null}; }
        if(st.op.type==="upsert"){ const row = st.op.row; const ex = rows.find(r=>r.id===row.id); if(ex){ Object.assign(ex, row); } else { rows.push(Object.assign({created_at:new Date().toISOString()}, row)); } return {data:null, error:null}; }
      }
      let out = rows.filter(r=>st.filters.every(f=>f(r))).slice();
      if(name==="mk_applications" && DEMO_ME.role==="member"){ out = out.filter(r=>r.from_id===DEMO_UID || r.to_id===DEMO_UID); }
      if(st.ord){ out.sort((a,b)=>{ const x=String(a[st.ord.k]||""), y=String(b[st.ord.k]||""); return (x<y?-1:(x>y?1:0))*(st.ord.asc?1:-1); }); }
      if(st.lim){ out = out.slice(0, st.lim); }
      if(st.count && st.head){ return {count: out.length, data:null, error:null}; }
      if(st.joins && name==="mk_applications"){ out = joinApps(out); }
      if(st.one){ const r = out[0]||null; if(st.one==="single" && !r){ return {data:null, error:{message:"データが見つかりません（デモ）"}}; } return {data:r, error:null}; }
      return {data:out, error:null};
    }
    const api = {
      select(cols, opts){ if(opts){ st.head = !!opts.head; st.count = opts.count==="exact"; } st.joins = typeof cols==="string" && cols.indexOf("fromP:")>=0; return api; },
      insert(row){ st.op = {type:"insert", row}; return api; },
      update(patch){ st.op = {type:"update", patch}; return api; },
      upsert(row){ st.op = {type:"upsert", row}; return api; },
      eq(k,v){ st.filters.push(r=>r[k]===v); return api; },
      gte(k,v){ st.filters.push(r=>String(r[k])>=String(v)); return api; },
      in(k,arr){ st.filters.push(r=>arr.indexOf(r[k])>=0); return api; },
      order(k,o){ st.ord = {k, asc: !(o && o.ascending===false)}; return api; },
      limit(n){ st.lim = n; return api; },
      maybeSingle(){ st.one = "maybe"; return api; },
      single(){ st.one = "single"; return api; },
      then(res, rej){ return Promise.resolve().then(run).then(res, rej); }
    };
    return api;
  }
  return {
    from(name){ return qb(name); },
    auth: {
      getSession(){ return Promise.resolve({data:{session:curSession}}); },
      onAuthStateChange(cb){ listeners.push(cb); return {data:{subscription:{unsubscribe(){}}}}; },
      signInWithOtp(){ return Promise.resolve({error:null}); },
      verifyOtp(){ curSession = {user:{id:DEMO_UID}}; const s = curSession; setTimeout(()=>listeners.forEach(cb=>cb("SIGNED_IN", s)), 0); return Promise.resolve({error:null}); },
      signOut(){ curSession = null; setTimeout(()=>listeners.forEach(cb=>cb("SIGNED_OUT", null)), 0); return Promise.resolve({error:null}); }
    },
    rpc(fn, args){
      if(fn==="mk_check_qualified"){ return Promise.resolve({data:true, error:null}); }
      if(fn==="mk_me"){ return Promise.resolve({data:[Object.assign({}, DEMO_ME)], error:null}); }
      if(fn==="mk_respond_application"){
        const a = tbl("mk_applications").find(x=>x.id===args.p_app_id);
        if(!a) return Promise.resolve({data:"not_found", error:null});
        if(a.to_id!==DEMO_UID) return Promise.resolve({data:"forbidden", error:null});
        if(a.status!=="peer_pending") return Promise.resolve({data:"already_decided", error:null});
        if(args.p_accept){ a.status="done_matched"; a.decided_at=new Date().toISOString();
          tbl("mk_events").unshift({id:"ev-x"+Math.random(), kind:"auto", body:"相互マッチが成立し連絡先を開示（デモ）", created_at:a.decided_at});
        } else { a.status="done_declined"; a.reject_reason=(args.p_comment&&args.p_comment.trim())||"お相手の都合により今回は見送りになりました。"; a.decided_at=new Date().toISOString(); }
        return Promise.resolve({data:"ok", error:null});
      }
      return Promise.resolve({data:null, error:{message:"デモ未対応のRPC: "+fn}});
    },
    storage: {
      from(){
        return {
          createSignedUrls(paths){ return Promise.resolve({data: paths.map(p=>({signedUrl: DEMO_PHOTOS[p]||null}))}); },
          upload(path, blob){ DEMO_PHOTOS[path] = URL.createObjectURL(blob); return Promise.resolve({error:null}); },
          remove(paths){ (paths||[]).forEach(p=>{ delete DEMO_PHOTOS[p]; }); return Promise.resolve({error:null}); }
        };
      }
    }
  };
}

/* ============ AI充実度採点（100点：自己紹介30/話したい20/力になれる20/画像10/SNS10/名前10） ============ */
function profileScore100(p){
  const items = [];
  const bio = p.bio||"";
  let bioGot = 0; const bioTips = [];
  if(bio.length>=50){ bioGot+=10; } else { bioTips.push("50文字以上にする（+10点）"); }
  if(bio.length>=100){ bioGot+=10; } else { bioTips.push("100文字以上にする（+10点）"); }
  if(/\d/.test(bio)){ bioGot+=5; } else { bioTips.push("実績や目標の数字を1つ入れる（+5点）例：歴5年・月商30万円"); }
  if(/(したい|目標|挑戦|目指)/.test(bio)){ bioGot+=5; } else { bioTips.push("「〜したい」「目標」など今後の意欲をひとこと入れる（+5点）"); }
  items.push({label:"自己紹介", got:bioGot, max:30, tips:bioTips});
  const tCnt = (p.talk_tags||[]).length;
  items.push({label:"話したいトピック", got:Math.min(tCnt,5)*4, max:20, tips: tCnt>=5?[]:["あと"+(5-tCnt)+"個選ぶと満点（1個につき+4点）"]});
  const sCnt = (p.skill_tags||[]).length;
  items.push({label:"力になれること", got:[0,8,14,20][Math.min(3,sCnt)], max:20, tips: sCnt>=3?[]:["3個以上選ぶと満点（現在"+sCnt+"個）"]});
  const hasPhoto = !!(p.photo_path || p.photoDataUrl);
  items.push({label:"プロフィール画像", got:hasPhoto?10:0, max:10, tips:hasPhoto?[]:["プロフィール写真を設定する（+10点）"]});
  let snsCnt = 0;
  const sns = p.sns||{};
  ["x","instagram","facebook","youtube"].forEach(k=>{ if(((sns[k])||"").trim()) snsCnt++; });
  items.push({label:"SNSリンク", got:snsCnt>=2?10:(snsCnt===1?5:0), max:10, tips:snsCnt>=2?[]:["SNSを2つ以上登録すると満点（1つで+5点）"]});
  const nm = (p.name||"").trim();
  const nGot = nm ? (/[\s　]/.test(nm)?10:5) : 0;
  items.push({label:"名前", got:nGot, max:10, tips:nGot===10?[]:["姓と名の間にスペースを入れたフルネームにする"]});
  let total = 0; items.forEach(it=>{ total += it.got; });
  return {total, items};
}

/* ============ 申請の事前チェック ============ */
function hardCheck(text){
  const flags = [];
  if(/[\w.\-]+@[\w\-]+\.[a-z]{2,}/i.test(text) || /\d{2,4}-\d{2,4}-\d{3,4}/.test(text)){ flags.push("連絡先の直書き（メール/電話）"); }
  if(/(LINE|ライン)[^\n]{0,4}(ID|iD)/i.test(text) || /\b(ID|id)[ ：:]?[a-z0-9_.\-]{5,}/.test(text)){ flags.push("連絡先の直書き（SNSのID）"); }
  if(/(有料サロン|外部サロン|別サービス|投資に興味|必ず儲か|絶対に稼げ|紹介できます)/.test(text)){ flags.push("外部サービスへの勧誘・営業表現"); }
  if(/(バカ|無能|詐欺師)/.test(text)){ flags.push("誹謗中傷・NGワードの混入"); }
  return flags;
}
function scoreApplication(fromP, toP, body){
  const scores = {purpose:0, targetFit:0, concrete:0, manner:0, profile:0};
  const len = (body||"").length;
  scores.purpose = 10 + (len>=40?5:0) + (/(したい|ため|目標)/.test(body)?5:0) + (/(相談|壁打ち|教え|見ていただ)/.test(body)?5:0);
  let overlap = 0;
  if(fromP && toP){ (fromP.talk_tags||[]).forEach(t=>{ if((toP.skill_tags||[]).includes(t)) overlap++; }); }
  scores.targetFit = overlap>=3?25:(overlap===2?20:(overlap===1?15:8));
  scores.concrete = 8 + (/\d/.test(body)?6:0) + (len>=80?6:0);
  scores.manner = /(至急|今すぐ|早くして)/.test(body) ? 8 : 15;
  scores.profile = fromP ? Math.round(profileScore100(fromP).total*0.15) : 0;
  return scores;
}

  byId("loginBtn").disabled = true;

    pendingEmail = email;

async function openApplyModal(targetId){
  if(!myProfile){
    openModal('<h3>先にプロフィール登録をお願いします</h3><p>話したい申請には、あなたのプロフィールが必要です（相手とスタッフが確認するため）。</p>'+
      '<div class="actions"><button class="btn" onclick="closeModal()">閉じる</button><button class="btn primary" id="goProfBtn">プロフィールを登録する</button></div>');
    byId("goProfBtn").addEventListener("click", ()=>{ closeModal(); currentTab="mp"; profDraft=null; render(); });
    return;
  }
  if(!(cfg.rankCanApply||DEFAULT_CFG.rankCanApply)[me.rank]){
    openModal('<h3>現在このランクからの申請は停止中です</h3><p>'+esc(RANKS[me.rank].label)+' からの申請は現在受け付けていません。</p><div class="actions"><button class="btn primary" onclick="closeModal()">閉じる</button></div>');
    return;
  }
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  const {count} = await sb.from("mk_applications").select("id",{count:"exact", head:true}).eq("from_id", session.user.id).gte("created_at", monthStart.toISOString());
  if((count||0) >= (cfg.monthlyLimit||3)){
    openModal('<h3>今月の申請上限に達しています</h3><p>1人あたりの申請は月'+(cfg.monthlyLimit||3)+'件までです。来月あらためて申請してください。</p><div class="actions"><button class="btn primary" onclick="closeModal()">閉じる</button></div>');
    return;
  }
  const target = profById(targetId);
  if(!target) return;
  let h = '<h3>'+esc(target.name)+' さんに話したい申請</h3>'+
    '<p>申請はお相手に直接届きます。お相手が「私も話したい」と承諾するとマッチ成立となり、お互いの連絡先が開示されます。</p>'+
    '<label>相談したい内容（テーマは1つに絞ると成立しやすくなります）</label>'+
    '<textarea id="applyBody">'+esc("現在◯◯に取り組んでおり、"+((target.skill_tags||[])[0]||"")+"について30分ご相談したいです。数字や資料は事前に共有します。")+'</textarea>'+
    '<label>希望する形式</label>'+
    '<select id="applyWish"><option>オンライン30分</option><option>オンライン60分</option><option>チャット</option></select>'+
    '<div class="autobox">🤖 <b>自動運用ポイント</b>：送信すると100点ルーブリックで事前チェックし、'+cfg.reviewMin+'点以上の申請はそのままお相手に届きます。連絡先の直書きや勧誘表現はその場で差し戻します（スタッフも全申請を見守っています）。</div>'+
    '<div class="actions"><button class="btn" onclick="closeModal()">やめる</button><button class="btn primary" id="applySubmitBtn">申請する</button></div>';
  openModal(h);
  byId("applySubmitBtn").addEventListener("click", ()=>submitApplication(target));
}
async function submitApplication(target){
  const body = byId("applyBody").value||"";
  const wish = byId("applyWish").value;
  if(body.trim().length<10){ toast("相談したい内容をもう少し具体的に書いてください","warn"); return; }
  byId("applySubmitBtn").disabled = true;
  const hard = hardCheck(body);
  const scores = hard.length>0 ? null : scoreApplication(myProfile, target, body);
  const total = totalScore(scores);
  let lane, status, reject_reason = "", decided_at = null;
  if(hard.length>0){ lane="reject"; status="done_reject"; reject_reason="ハード違反により点数無効・自動差し戻し。連絡先交換はマッチ成立後に開示される連絡先で行ってください。"; decided_at = new Date().toISOString(); }
  else if(total>=cfg.priorityMin){ lane="priority"; status="peer_pending"; }
  else if(total>=cfg.reviewMin){ lane="normal"; status="peer_pending"; }
  else { lane="reject"; status="done_reject"; reject_reason="自動差し戻し：合計"+total+"点。目的とテーマを絞って再申請してください。"; decided_at = new Date().toISOString(); }
  try{
    const {error} = await sb.from("mk_applications").insert({
      from_id: session.user.id, to_id: target.id, body, wish,
      scores, total, hard, lane, status, reject_reason, decided_at
    });
    if(error) throw error;
    await sb.from("mk_events").insert({kind: status==="done_reject"?"reject":"review",
      body: me.name+"さんから"+target.name+"さんへ話したい申請"+(status==="done_reject"?"（自動差し戻し）":"（"+total+"点・お相手の返事待ち）")});
    closeModal(); currentTab="m2"; render();
    if(status==="done_reject"){ toast("申請は差し戻しになりました。M2タブで理由を確認できます","err"); }
    else { toast("申請を送りました（事前チェック"+total+"点）。お相手の返事をお待ちください","ok"); }
  }catch(e){ toast(errMsg(e),"err"); const b=byId("applySubmitBtn"); if(b) b.disabled=false; }
}

function laneLabel(a){
  if(a.status==="done_matched") return '<span class="pill p-auto">マッチ成立</span>';
  if(a.status==="done_reject") return '<span class="pill p-reject">差し戻し</span>';
  if(a.status==="done_declined") return '<span class="pill p-review">見送り</span>';
  if(a.status==="peer_pending") return '<span class="pill p-new">お相手の返事待ち</span>';
  if(a.status==="final_pending") return '<span class="pill p-stage">最終承認待ち</span>';
  const lane = a.lane==="priority" ? '<span class="pill p-auto">優先レーン</span>' : '<span class="pill p-review">通常レビュー</span>';
  return lane+' <span class="pill p-new">一次確認待ち</span>';
}
async function appItem(a, withActions){
  const from = a.fromP||{name:"退会済み",rank:"crew"}, to = a.toP||{name:"退会済み",rank:"crew"};
  let h = '<div class="item">';
  h += '<div class="top"><div><div class="ttl">'+esc(from.name)+' → '+esc(to.name)+' <span class="pill '+RANKS[from.rank].pill+'">'+RANKS[from.rank].label+'</span> → <span class="pill '+RANKS[to.rank].pill+'">'+RANKS[to.rank].label+'</span></div>';
  h += '<div class="meta">申請日時：'+esc(fmtDt(a.created_at))+' ／ 希望形式：'+esc(a.wish)+'</div></div>';
  h += '<div>'+laneLabel(a)+'</div></div>';
  h += '<div class="bio">'+esc(a.body)+'</div>';
  if(a.scores){
    h += '<div class="scorebar">';
    RUBRIC.forEach(r=>{ h += '<div class="sc">'+esc(r.label)+'<b>'+(a.scores[r.key]||0)+' / '+r.max+'</b></div>'; });
    h += '<div class="sc" style="background:var(--blue-bg)">合計<b class="total">'+a.total+'</b></div></div>';
  }
  if((a.hard||[]).length>0){ h += '<div class="hardflag">■ ハード上書き検査に該当：'+esc(a.hard.join(" ／ "))+' → 点数無効・強制差し戻し</div>'; }
  if(a.match_plan){ h += '<div class="meta" style="margin-top:8px">スタッフのマッチ案：'+esc(a.match_plan)+'</div>'; }
  if(a.status==="done_matched"){
    const mine = a.from_id===session.user.id || a.to_id===session.user.id;
    if(mine || me.role!=="member"){
      const otherId = a.from_id===session.user.id ? a.to_id : a.from_id;
      const {data: c} = await sb.from("mk_contacts").select("*").eq("id", otherId).maybeSingle();
      if(c){
        const sns = [];
        if(c.sns && c.sns.x) sns.push("X: "+c.sns.x);
        if(c.sns && c.sns.instagram) sns.push("Instagram: "+c.sns.instagram);
        if(c.sns && c.sns.facebook) sns.push("Facebook: "+c.sns.facebook);
        if(c.sns && c.sns.youtube) sns.push("YouTube: "+c.sns.youtube);
        h += '<div class="autobox" style="border-left-color:var(--green);color:#14532d;background:var(--green-bg)">🎉 <b>マッチ成立</b>（'+esc(fmtDt(a.decided_at))+'）：連絡先 → '+esc(c.email)+(sns.length?" ／ "+esc(sns.join(" ／ ")):"")+'</div>';
      } else {
        h += '<div class="meta" style="margin-top:8px">マッチ成立（'+esc(fmtDt(a.decided_at))+'）</div>';
      }
    }
  }
  if((a.status==="done_reject"||a.status==="done_declined") && a.reject_reason){ h += '<div class="warn">'+esc(a.reject_reason)+'</div>'; }
  if(!withActions && a.status==="peer_pending" && a.to_id===session.user.id){
    h += '<div class="actions"><button class="btn ok sm" data-accept="'+a.id+'">私も話したい（承諾してマッチ成立）</button>'+
      '<button class="btn sm" data-decline="'+a.id+'">今回は見送る</button></div>';
  }
  if(withActions){ h += queueActions(a); }
  h += '</div>';
  return h;
}

  } else {
    openModal('<h3>今回は見送りますか？</h3>'+
      '<p>見送りの理由はお相手に表示されます（未記入の場合は定型文が入ります）。連絡先は開示されません。</p>'+

      }
      closeModal(); render();
      toast(accept ? "マッチが成立しました。お互いの連絡先が開示されます" : "見送りました。理由はお相手に表示されます", accept?"ok":"warn");
    }catch(e){ toast(errMsg(e),"err"); }
  });
}

async function viewKb(){
  const {data} = await sb.from("mk_knowledge").select("*").order("created_at",{ascending:false});
  const list = data||[];
  const oks = list.filter(x=>!x.rej), ngs = list.filter(x=>x.rej);
  let h = '<div class="card"><h2>📚 マッチングナレッジ</h2>'+
    '<div class="desc">成立事例と差し戻し事例の記録です。</div>'+
    '<div class="autobox">🤖 <b>自動運用ポイント</b>：マッチ成立・差し戻しのたびに自動でナレッジ化され、スタッフの判断基準が資産になります。</div></div>';
  h += '<div class="card"><h2>成立ナレッジ <span class="pill p-auto">'+oks.length+'件</span></h2>';
  if(oks.length===0){ h += '<div class="desc">まだ成立事例はありません。</div>'; }
  oks.forEach(x=>{ h += '<div class="item kn"><div class="top"><div class="ttl">'+esc(x.title)+'</div><div class="meta">'+esc(fmtDt(x.created_at))+'</div></div><div class="knbody">'+esc(x.body)+'</div></div>'; });
  h += '</div><div class="card"><h2>差し戻しナレッジ <span class="pill p-reject">'+ngs.length+'件</span></h2>';
  if(ngs.length===0){ h += '<div class="desc">まだ差し戻し事例はありません。</div>'; }
  ngs.forEach(x=>{ h += '<div class="item kn rej"><div class="top"><div class="ttl">'+esc(x.title)+'</div><div class="meta">'+esc(fmtDt(x.created_at))+'</div></div><div class="knbody">'+esc(x.body)+'</div></div>'; });
  h += '</div>';
  return h;
}

/* ============ マイプロフィール ============ */
function initProfDraft(){
  if(myProfile){
    profDraft = {name: myProfile.name, talk_tags:(myProfile.talk_tags||[]).slice(), skill_tags:(myProfile.skill_tags||[]).slice(), bio: myProfile.bio||"", sns: Object.assign({}, (myContact&&myContact.sns)||{}), photo_path: myProfile.photo_path||null, photoDataUrl:null, photoBlob:null, removePhoto:false};
  } else {
    profDraft = {name: me.name||"", talk_tags:["マーケティング","AI活用"], skill_tags:["SNS"], bio:"PABLOSで学びながら、自分の事業を育てているところです。まずは月10万円の売上づくりを目標にしています。", sns:{}, photo_path:null, photoDataUrl:null, photoBlob:null, removePhoto:false};
  }
}
function viewMp(){
  let h = '<div class="card"><h2>マイプロフィール</h2>'+
    '<div class="desc">'+(myProfile?"名鑑に掲載されている自分のプロフィールを、ここでいつでも編集できます。":"プロフィールを登録すると名鑑に掲載され、話したい申請が出せるようになります。")+'</div>'+
    '<div class="autobox">🤖 <b>自動運用ポイント</b>：AIがプロフィールを100点満点で自動採点し、足りない項目と上げ方をその場で提案します。90点以上になると名鑑に「★ 充実プロフィール」バッジが付きます。</div></div>';
  if(!profDraft){ initProfDraft(); }
  const p = profDraft;
  h += '<div class="card" id="scorePanel">'+scorePanelHtml(p)+'</div>';
  h += '<div class="card">';
  h += '<label>名前 <span style="color:var(--red)">*</span><span class="counter" id="nameCount">'+p.name.length+'/30</span></label>';
  h += '<input type="text" id="pfName" maxlength="30" value="'+esc(p.name)+'">';
  h += '<div class="helper">名鑑に表示される名前です（資格ランク：'+RANKS[me.rank].label+'は資格者リストから自動設定）</div>';
  h += '<label>プロフィール画像</label>';
  const avSrc = p.photoDataUrl || (p.photo_path ? (photoUrls[session.user.id]||null) : null);
  const avInner = avSrc ? '<img src="'+esc(avSrc)+'" alt="">' : esc(initialsOf(p.name));
  h += '<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div class="avatar '+RANKS[me.rank].av+'">'+avInner+'</div>';
  h += '<button class="btn sm" id="photoPickBtn">写真を変更する</button>';
  if(avSrc || p.photo_path){ h += '<button class="btn sm ghost" id="photoDelBtn">削除する</button>'; }
  h += '<input type="file" id="pfPhotoInput" accept="image/*" class="hidden"></div>';
  h += '<div class="helper">選択しない場合は名前の頭文字アイコンになります。写真は自動で縮小され、資格者だけに表示されます</div>';
  h += '<label>興味・話したいトピック <span style="color:var(--red)">*</span></label>';
  h += tagPicker("talk_tags");
  h += '<div class="helper">複数選択できます。相性の良いメンバーのおすすめ表示にも使われます</div>';
  h += '<label>力になれること（スキル・経験）</label>';
  h += tagPicker("skill_tags");
  h += '<div class="helper">任意です。ここに選んだトピックに興味がある人へ優先的におすすめ表示されます</div>';
  h += '<label>自己紹介 <span style="color:var(--red)">*</span><span class="counter" id="bioCount">'+p.bio.length+'/200</span></label>';
  h += '<textarea id="pfBio" maxlength="200">'+esc(p.bio)+'</textarea>';
  h += '<label>X (Twitter)</label><input type="text" id="pfX" value="'+esc(p.sns.x||"")+'"><div class="helper">ユーザー名またはURLのどちらでもOK。マッチ成立まで相手には表示されません</div>';
  h += '<label>Instagram</label><input type="text" id="pfIg" value="'+esc(p.sns.instagram||"")+'"><div class="helper">ユーザー名またはURLのどちらでもOK</div>';
  h += '<label>Facebook</label><input type="text" id="pfFb" value="'+esc(p.sns.facebook||"")+'"><div class="helper">ユーザー名またはURLのどちらでもOK</div>';
  h += '<label>YouTube</label><input type="text" id="pfYt" value="'+esc(p.sns.youtube||"")+'"><div class="helper">チャンネル名またはURLのどちらでもOK</div>';
  h += '<div class="actions"><button class="btn primary" id="saveProfBtn">'+(myProfile?"保存する":"登録して名鑑に載る")+'</button></div>';

function tagPicker(kind){
  const sel = profDraft[kind];
  let h = "";
  TAG_GROUPS.forEach((g,gi)=>{
    h += '<div class="tagGroupLabel">'+esc(g.label)+'</div><div class="chips">';
    g.tags.forEach((t,ti)=>{
      const on = sel.includes(t);
      h += '<span class="chip pick'+(on?(kind==="talk_tags"?" on-talk":" on-skill"):"")+'" data-tag="'+kind+':'+gi+':'+ti+'">'+esc(t)+'</span>';
    });
    h += '</div>';
  });
  return h;
}
function updateScorePanel(){
  const el = byId("scorePanel");
  if(el && profDraft){ el.innerHTML = scorePanelHtml(profDraft); bindAiDraft(); }
}
function bindAiDraft(){
  const b = byId("aiDraftBtn");
  if(b) b.addEventListener("click", ()=>{
    const p = profDraft;
    const talks = p.talk_tags.slice(0,2).join("と");
    const skill = p.skill_tags[0]||"";
    let draft = RANKS[me.rank].label+"の"+((p.name||"").trim()||"メンバー")+"です。いま一番話したいテーマは"+(talks||"これからの学び")+"。"+
      (skill?("これまでの経験から、"+skill+"のことなら力になれます。"):"")+
      "PABLOSでの目標は、100日で最初のファン顧客をつくること。まずはオンライン30分で気軽にお話ししたいです。";
    if(draft.length>200){ draft = draft.slice(0,200); }
    p.bio = draft;
    renderBody();
    toast("AIがたたき台を作成しました。自分の言葉に直すとさらに良くなります","ok");
  });
}
function pfPhotoPicked(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (e)=>{
    img.onload = ()=>{
      const maxSize = 384;
      const scale = Math.min(1, maxSize/Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*scale));
      const hh = Math.max(1, Math.round(img.height*scale));
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = hh;
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, w, hh);
      ctx.drawImage(img, 0, 0, w, hh);
      cv.toBlob((blob)=>{
        if(!blob){ toast("画像を読み込めませんでした","err"); return; }
        profDraft.photoBlob = blob;
        profDraft.photoDataUrl = cv.toDataURL("image/jpeg", 0.85);
        profDraft.removePhoto = false;
        renderBody();
        toast("写真を設定しました。保存ボタンで確定します","ok");
      }, "image/jpeg", 0.85);
    };
    img.onerror = ()=>toast("画像を読み込めませんでした","err");
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function bindMp(){
  const nameI = byId("pfName"), bioI = byId("pfBio");
  const pickBtn = byId("photoPickBtn"), photoInput = byId("pfPhotoInput"), delBtn = byId("photoDelBtn");
  if(pickBtn && photoInput) pickBtn.addEventListener("click", ()=>photoInput.click());
  if(photoInput) photoInput.addEventListener("change", ()=>pfPhotoPicked(photoInput));
  if(delBtn) delBtn.addEventListener("click", ()=>{ profDraft.photoDataUrl=null; profDraft.photoBlob=null; profDraft.photo_path=null; profDraft.removePhoto=true; renderBody(); toast("写真を外しました。保存ボタンで確定します"); });
  if(nameI) nameI.addEventListener("input", ()=>{ profDraft.name=nameI.value; byId("nameCount").textContent=nameI.value.length+"/30"; updateScorePanel(); });
  if(bioI) bioI.addEventListener("input", ()=>{ profDraft.bio=bioI.value; byId("bioCount").textContent=bioI.value.length+"/200"; updateScorePanel(); });
  [["pfX","x"],["pfIg","instagram"],["pfFb","facebook"],["pfYt","youtube"]].forEach(([id,k])=>{
    const el = byId(id);
    if(el) el.addEventListener("input", ()=>{ profDraft.sns[k]=el.value; updateScorePanel(); });
  });
  document.querySelectorAll("[data-tag]").forEach(ch=>{
    ch.addEventListener("click", ()=>{
      const [kind, gi, ti] = ch.dataset.tag.split(":");
      const t = TAG_GROUPS[+gi].tags[+ti];
      const arr = profDraft[kind];
      const idx = arr.indexOf(t);
      if(idx>=0){ arr.splice(idx,1); } else { arr.push(t); }
      renderBody();
    });
  });
  bindAiDraft();
  const save = byId("saveProfBtn");
  if(save) save.addEventListener("click", saveProfile);
}
async function saveProfile(){
  const p = profDraft;
  if(!p.name.trim()){ toast("名前を入力してください","warn"); return; }
  if(p.talk_tags.length===0){ toast("話したいトピックを1つ以上選んでください","warn"); return; }
  if(!p.bio.trim()){ toast("自己紹介を入力してください","warn"); return; }
  byId("saveProfBtn").disabled = true;
  const isNew = !myProfile;
  try{
    let photoPath = myProfile ? (myProfile.photo_path||null) : null;
    if(p.removePhoto && photoPath){
      const {error: rmErr} = await sb.storage.from("avatars").remove([photoPath]);
      if(rmErr) throw rmErr;
      photoPath = null;
    }
    if(p.photoBlob){
      photoPath = session.user.id + "/avatar.jpg";
      const {error: upErr} = await sb.storage.from("avatars").upload(photoPath, p.photoBlob, {upsert:true, contentType:"image/jpeg", cacheControl:"3600"});
      if(upErr) throw upErr;
    }
    p.photo_path = photoPath;
    p.photoBlob = null;
    const score = profileScore100(p).total;
    const {error: pe} = await sb.from("mk_profiles").upsert({
      id: session.user.id, name: p.name.trim(), rank: me.rank,
      talk_tags: p.talk_tags, skill_tags: p.skill_tags, bio: p.bio, ai_score: score,
      photo_path: photoPath,
      updated_at: new Date().toISOString()
    });
    if(pe) throw pe;
    const {error: ce} = await sb.from("mk_contacts").upsert({
      id: session.user.id, email: me.email, sns: p.sns, updated_at: new Date().toISOString()
    });
    if(ce) throw ce;
    if(isNew){ await sb.from("mk_events").insert({kind:"auto", body: p.name.trim()+"さんがプロフィールを登録し名鑑に掲載されました"}); }
    await reloadProfiles();
    const {data: c} = await sb.from("mk_contacts").select("*").eq("id", session.user.id).maybeSingle();
    myContact = c;
    render(); toast("プロフィールを保存しました","ok");
  }catch(e){
    toast(errMsg(e),"err");
    const b = byId("saveProfBtn"); if(b) b.disabled = false;
  }
}

/* ============ 設定（事務局長のみ） ============ */
function viewCfg(){
  const c = cfg;
  let h = '<div class="card"><h2>⚙️ 設定（事務局長のみ・変更は即反映）</h2>'+
    '<div class="desc">閾値・上限をここから変更できます。資格者リスト自体は毎朝の自動同期（顧客DBマスター基準）で管理されます。</div>'+
    '<div class="autobox">🤖 <b>自動運用ポイント</b>：ここで変えた閾値は、次の申請の採点・振分からすぐ適用されます。</div>';
  h += '<div class="row"><div><label>優先レーンの閾値（この点数以上）</label><input type="number" id="cfgPriority" value="'+c.priorityMin+'" min="1" max="100"></div>';
  h += '<div><label>通常レビューの下限（未満は自動差し戻し）</label><input type="number" id="cfgReview" value="'+c.reviewMin+'" min="1" max="100"></div>';
  h += '<div><label>月間申請上限（1人あたり）</label><input type="number" id="cfgLimit" value="'+c.monthlyLimit+'" min="1" max="20"></div></div>';
  h += '<div style="margin-top:14px"><label>ランク別の申請可否</label>';
  ["mentor","leader","crew","staff","office"].forEach(r=>{
    h += '<div class="toggleRow"><span>'+RANKS[r].label+' からの話したい申請</span><div class="toggle'+((c.rankCanApply||{})[r]?" on":"")+'" data-ranktoggle="'+r+'"></div></div>';
  });
  h += '</div><div class="actions"><button class="btn primary" id="cfgSaveBtn">設定を保存する</button></div></div>';
  return h;
}
function bindCfg(){
  document.querySelectorAll("[data-ranktoggle]").forEach(t=>{
    t.addEventListener("click", ()=>{ const r=t.dataset.ranktoggle; cfg.rankCanApply[r]=!cfg.rankCanApply[r]; renderBody(); });
  });
  const b = byId("cfgSaveBtn");
  if(b) b.addEventListener("click", async ()=>{
    const pv = parseInt(byId("cfgPriority").value,10), rv = parseInt(byId("cfgReview").value,10);
    if(isNaN(pv)||isNaN(rv)||pv<=rv){ toast("優先レーンの閾値は通常レビュー下限より大きくしてください","warn"); return; }
    cfg.priorityMin=pv; cfg.reviewMin=rv; cfg.monthlyLimit=Math.max(1,parseInt(byId("cfgLimit").value,10)||3);
    try{
      const {error} = await sb.from("mk_settings").update({cfg}).eq("id",1);
      if(error) throw error;
      toast("設定を保存しました","ok");
    }catch(e){ toast(errMsg(e),"err"); }
  });
}

/* ============ 描画 ============ */
async function renderBody(){
  const app = byId("app");
  let h = "";
  if(currentTab==="m1") h = viewM1();
  else if(currentTab==="m2"){ app.innerHTML = '<div class="loading">読み込み中…</div>'; h = await viewM2(); }
  else if(currentTab==="mp") h = viewMp();
  else if(currentTab==="m3"){ app.innerHTML = '<div class="loading">読み込み中…</div>'; h = await viewM3(); }
  else if(currentTab==="m4"){ app.innerHTML = '<div class="loading">読み込み中…</div>'; h = await viewM4(); }
  else if(currentTab==="kb"){ app.innerHTML = '<div class="loading">読み込み中…</div>'; h = await viewKb(); }
  else if(currentTab==="cfg") h = viewCfg();
  app.innerHTML = h;
  if(currentTab==="m1") bindM1();
  if(currentTab==="m2") bindM2();
  if(currentTab==="mp") bindMp();
  if(currentTab==="m3") bindM3();
  if(currentTab==="cfg") bindCfg();
}
async function render(){
  if(!session){ renderLogin(); return; }
  if(!me){ return; }
  renderChrome();
  await renderBody();
}

/* ============ 起動 ============ */
byId("logoutBtn").addEventListener("click", async ()=>{ await sb.auth.signOut(); toast("ログアウトしました"); });
sb.auth.onAuthStateChange((_event, s)=>{
  const had = !!session;
  session = s;
  if(s && !me){ bootWithSession(); }
  if(!s){ me=null; myProfile=null; myContact=null; profiles=[]; if(had) renderLogin(); }
});
const {data:{session: s0}} = await sb.auth.getSession();
session = s0;
if(session){ await bootWithSession(); } else { renderLogin(); }
