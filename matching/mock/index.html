<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PABLOS メンバー名鑑 & マッチング（モック）</title>
<style>
  :root{
    --bg:#fafafa; --card:#fff; --ink:#1e2228; --sub:#5a626c; --line:#e2e6ec;
    --blue:#2563eb; --blue-bg:#eff6ff; --green:#16a34a; --green-bg:#f0fdf4;
    --amber:#d97706; --amber-bg:#fffbeb; --red:#dc2626; --red-bg:#fef2f2;
    --purple:#7c3aed; --purple-bg:#f5f3ff; --slate:#475569;
    --orange:#ea580c; --orange-bg:#fff7ed;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    font-size:0.98rem; line-height:1.6;
  }
  .wrap{max-width:1180px; margin:0 auto; padding:0 18px 60px}
  header.hero{background:var(--card); border-bottom:1px solid var(--line)}
  .heroimg{display:block; width:100%; height:auto; border-bottom:1px solid var(--line)}
  .heroband{max-width:1180px; margin:0 auto; padding:18px 18px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:14px; justify-content:space-between}
  .heroband h1{font-size:1.35rem; margin:0}
  .heroband .lead{color:var(--sub); font-size:0.95rem; margin-top:4px}
  .heroActions{display:flex; gap:8px; flex-wrap:wrap}
  .btn{font-family:inherit; font-size:0.95rem; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px; border-radius:9px; cursor:pointer; transition:.12s}
  .btn:hover{border-color:var(--slate)}
  .btn.primary{background:var(--blue); color:#fff; border-color:var(--blue)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent}
  .btn.danger{background:var(--red); color:#fff; border-color:var(--red)}
  .btn.ok{background:var(--green); color:#fff; border-color:var(--green)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn.sm{padding:5px 10px; font-size:0.88rem; border-radius:7px}
  nav.tabs{position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line); box-shadow:0 1px 3px rgba(0,0,0,.03)}
  .tabsInner{max-width:1180px; margin:0 auto; display:flex; gap:4px; padding:6px 12px; overflow-x:auto}
  .tab{font-size:0.95rem; border:none; background:transparent; color:var(--sub); padding:10px 14px; cursor:pointer; border-radius:8px; white-space:nowrap; font-family:inherit}
  .tab:hover{background:var(--bg)}
  .tab.active{color:var(--blue); background:var(--blue-bg); font-weight:700}
  .opbar{max-width:1180px; margin:0 auto; display:flex; align-items:center; gap:10px; padding:8px 18px; flex-wrap:wrap; border-bottom:1px dashed var(--line); background:var(--card)}
  .opbar .who{font-size:0.9rem; color:var(--sub)}
  .switcher{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
  .switcher button{border:none; background:var(--card); font-family:inherit; font-size:0.9rem; padding:7px 13px; cursor:pointer; color:var(--sub)}
  .switcher button.on{background:var(--slate); color:#fff}
  .card{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:18px; margin-top:16px}
  .card h2{font-size:1.12rem; margin:0 0 4px}
  .card .desc{color:var(--sub); font-size:0.92rem; margin-bottom:6px}
  .autobox{background:#f8fbff; border:1px solid #dbe6fb; border-left:4px solid var(--blue); border-radius:10px; padding:11px 14px; margin:12px 0; font-size:0.92rem; color:#33507f}
  .autobox b{color:var(--blue)}
  .grid{display:grid; gap:12px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g6{grid-template-columns:repeat(6,1fr)}
  @media(max-width:820px){.g2,.g3,.g4,.g6{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:14px}
  .kpi .n{font-size:1.7rem; font-weight:800}
  .kpi .l{color:var(--sub); font-size:0.88rem}
  .item{border:1px solid var(--line); border-radius:11px; padding:14px; margin-top:10px; background:var(--card)}
  .item .top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap}
  .item .ttl{font-weight:700; font-size:1.02rem}
  .meta{color:var(--sub); font-size:0.85rem; margin-top:2px}
  .pill{display:inline-block; font-size:0.78rem; padding:3px 9px; border-radius:999px; font-weight:700}
  .p-auto{background:var(--green-bg); color:var(--green)}
  .p-review{background:var(--amber-bg); color:var(--amber)}
  .p-reject{background:var(--red-bg); color:var(--red)}
  .p-new{background:var(--purple-bg); color:var(--purple)}
  .p-stage{background:var(--blue-bg); color:var(--blue)}
  .p-mentor{background:var(--purple-bg); color:var(--purple)}
  .p-leader{background:var(--blue-bg); color:var(--blue)}
  .p-crew{background:var(--green-bg); color:var(--green)}
  .p-osusume{background:var(--orange-bg); color:var(--orange)}
  .p-rich{background:#fef9c3; color:#a16207}
  .pbar{height:12px; background:var(--line); border-radius:999px; overflow:hidden; margin:10px 0}
  .pbar>div{height:100%; border-radius:999px; transition:width .25s ease}
  .scorebar{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .sc{flex:1; min-width:90px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:0.82rem; color:var(--sub)}
  .sc b{display:block; color:var(--ink); font-size:1.02rem}
  .total{font-size:1.5rem; font-weight:800}
  .hardflag{background:var(--red-bg); border:1px solid #f3c2c2; border-radius:8px; padding:8px 11px; margin-top:10px; color:var(--red); font-size:0.88rem}
  .actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  label{display:block; font-size:0.86rem; color:var(--sub); margin:10px 0 4px}
  input[type=text],input[type=email],input[type=number],input[type=time],textarea,select{width:100%; font-family:inherit; font-size:0.95rem; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink)}
  textarea{min-height:78px; resize:vertical}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row>div{flex:1; min-width:180px}
  table{width:100%; border-collapse:collapse; margin-top:10px; font-size:0.95rem}
  th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line)}
  th{color:var(--sub); font-weight:700; font-size:0.82rem}
  .tl{border-left:2px solid var(--line); margin-left:8px; padding-left:16px}
  .tl .ev{position:relative; padding:7px 0}
  .tl .ev::before{content:""; position:absolute; left:-23px; top:12px; width:10px; height:10px; border-radius:50%; background:var(--slate)}
  .tl .ev.auto::before{background:var(--green)} .tl .ev.review::before{background:var(--amber)} .tl .ev.reject::before{background:var(--red)}
  .tl .t{font-size:0.8rem; color:var(--sub)}
  .toggleRow{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line)}
  .toggle{position:relative; width:44px; height:24px; border-radius:999px; background:var(--line); cursor:pointer; transition:.15s}
  .toggle.on{background:var(--green)}
  .toggle::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.15s}
  .toggle.on::after{left:23px}
  .warn{background:var(--amber-bg); border:1px solid #f2dca0; border-radius:8px; padding:8px 11px; font-size:0.86rem; color:#8a5a00; margin-top:8px}
  .locknote{color:var(--sub); font-size:0.86rem; background:var(--bg); border:1px dashed var(--line); border-radius:8px; padding:8px 11px; margin-top:10px}
  .kn{border-left:4px solid var(--green)}
  .kn.rej{border-left-color:var(--red)}
  .hidden{display:none !important}
  /* メンバーカード */
  .mcard{border:1px solid var(--line); border-radius:13px; padding:16px; background:var(--card)}
  .mhead{display:flex; gap:12px; align-items:center}
  .avatar{width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.15rem; color:#fff; flex-shrink:0; overflow:hidden}
  .avatar img{width:100%; height:100%; object-fit:cover}
  .av-mentor{background:var(--purple)} .av-leader{background:var(--blue)} .av-crew{background:var(--green)}
  .mname{font-weight:800; font-size:1.05rem}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
  .chip{display:inline-block; font-size:0.82rem; padding:4px 11px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink)}
  .chip.talk{border-color:#bfe3cb; background:var(--green-bg); color:#166534}
  .chip.skill{border-color:#f6d4b5; background:var(--orange-bg); color:#9a3412}
  .chip.pick{cursor:pointer; user-select:none}
  .chip.pick:hover{border-color:var(--slate)}
  .chip.pick.on-talk{background:var(--green); border-color:var(--green); color:#fff}
  .chip.pick.on-skill{background:var(--orange); border-color:var(--orange); color:#fff}
  .bio{font-size:0.95rem; color:#3a4048; margin-top:10px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px}
  .knbody{font-size:0.95rem; color:#3a4048; margin-top:6px}
  .tagGroupLabel{font-size:0.82rem; color:var(--sub); margin:12px 0 6px}
  .counter{float:right; font-size:0.8rem; color:var(--sub); font-weight:400}
  .helper{font-size:0.82rem; color:var(--sub); margin-top:4px}
  .filterbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px}
  .filterbar .seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
  .filterbar .seg button{border:none; background:var(--card); font-family:inherit; font-size:0.9rem; padding:7px 13px; cursor:pointer; color:var(--sub)}
  .filterbar .seg button.on{background:var(--blue); color:#fff}
  .filterbar input[type=text]{width:220px}
  /* ログイン */
  .loginWrap{max-width:560px; margin:40px auto 60px; padding:0 18px}
  .loginCard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px}
  .loginCard h2{margin:0 0 6px; font-size:1.25rem}
  .loginCard .desc{color:var(--sub); font-size:0.93rem}
  .demoNote{background:var(--purple-bg); border:1px solid #ded1fb; border-radius:10px; padding:10px 13px; font-size:0.86rem; color:#5b21b6; margin-top:14px}
  .otpBox{background:var(--bg); border:1px dashed var(--line); border-radius:10px; padding:12px 14px; margin-top:12px; font-size:0.9rem}
  .otpBox b{font-size:1.3rem; letter-spacing:4px}
  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(20,24,30,.42); display:flex; align-items:center; justify-content:center; z-index:60; padding:18px}
  .modal{background:var(--card); border-radius:14px; max-width:560px; width:100%; padding:22px; box-shadow:0 18px 50px rgba(0,0,0,.2); max-height:88vh; overflow-y:auto}
  .modal.wide{max-width:640px}
  .modal h3{margin:0 0 8px; font-size:1.1rem}
  .modal p{color:var(--sub); font-size:0.92rem; margin:0 0 12px}
  .modal .actions{justify-content:flex-end}
  /* toast */
  .toasts{position:fixed; right:18px; bottom:18px; z-index:80; display:flex; flex-direction:column; gap:8px}
  .toast{background:var(--ink); color:#fff; padding:11px 15px; border-radius:10px; font-size:0.9rem; box-shadow:0 8px 24px rgba(0,0,0,.22); animation:slidein .18s ease}
  .toast.ok{background:var(--green)} .toast.warn{background:var(--amber)} .toast.err{background:var(--red)}
  @keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .foot{color:var(--sub); font-size:0.82rem; text-align:center; margin-top:30px}
  @media print{
    nav.tabs,.opbar,.heroActions,.actions,.tab,.switcher,.btn{display:none !important}
    .panel.hidden{display:block !important}
    .panel{page-break-after:always}
    body{background:#fff}
    .autobox{border-left-color:#888}
  }
</style>
</head>

function loadState(){

/* ============ ユーティリティ ============ */
function esc(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function byId(id){ return document.getElementById(id); }
function memberById(id){ for(var i=0;i<state.members.length;i++){ if(state.members[i].id===id) return state.members[i]; } return null; }
function appById(id){ for(var i=0;i<state.apps.length;i++){ if(state.apps[i].id===id) return state.apps[i]; } return null; }
function totalScore(sc){ if(!sc) return 0; var t=0; for(var k in sc){ t+=sc[k]; } return t; }
function nowStr(){
  var d = new Date();
  function p(n){ return (n<10?"0":"")+n; }
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function monthKey(s){ return (s||"").slice(0,7); }
function initialsOf(name){ return (name||"?").trim().charAt(0); }
function toast(msg, cls){
  var t = document.createElement("div");
  t.className = "toast"+(cls?" "+cls:"");
  t.textContent = msg;
  byId("toasts").appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 3400);
}
function doPrint(){ window.print(); }

}

/* ============ 事前チェック（採点・ハード検査・振分） ============ */
function hardCheck(text){
  var flags = [];
  if(/[\w.\-]+@[\w\-]+\.[a-z]{2,}/i.test(text) || /(電話|TEL)[^\n]{0,6}\d{2,4}[-\d]{6,}/i.test(text) || /\d{2,4}-\d{2,4}-\d{3,4}/.test(text)){ flags.push("連絡先の直書き（メール/電話）"); }
  if(/(LINE|ライン)[^\n]{0,4}(ID|iD)/i.test(text) || /\b(ID|id)[ ：:]?[a-z0-9_.\-]{5,}/.test(text)){ flags.push("連絡先の直書き（SNSのID）"); }
  if(/(有料サロン|外部サロン|別サービス|投資に興味|必ず儲か|絶対に稼げ|紹介できます)/.test(text)){ flags.push("外部サービスへの勧誘・営業表現"); }
  if(/(バカ|無能|詐欺師)/.test(text)){ flags.push("誹謗中傷・NGワードの混入"); }
  return flags;
}
function scoreApplication(fromMember, toMember, body){
  var sc = {purpose:0, targetFit:0, concrete:0, manner:0, profile:0};
  var len = (body||"").length;
  sc.purpose = 10 + (len>=40?5:0) + (/(したい|ため|目標)/.test(body)?5:0) + (/(相談|壁打ち|教え|見ていただ)/.test(body)?5:0);
  var overlap = 0;
  if(fromMember && toMember){
    for(var i=0;i<fromMember.talkTags.length;i++){
      if(toMember.skillTags.indexOf(fromMember.talkTags[i])>=0) overlap++;
    }
  }
  sc.targetFit = overlap>=3?25:(overlap===2?20:(overlap===1?15:8));
  sc.concrete = 8 + (/\d/.test(body)?6:0) + (len>=80?6:0);
  sc.manner = /(至急|今すぐ|早くして)/.test(body) ? 8 : 15;
  sc.profile = fromMember ? Math.round(profileScore100(fromMember).total*0.15) : 0;
  return sc;
}
function routeApplication(total, hard){
  if(hard.length>0) return "reject";
  if(total>=state.cfg.priorityMin) return "priority";
  if(total>=state.cfg.reviewMin) return "normal";
  return "reject";
}
function laneLabel(app){
  if(app.status==="done_matched") return '<span class="pill p-auto">マッチ成立</span>';
  if(app.status==="done_reject") return '<span class="pill p-reject">差し戻し</span>';
  if(app.status==="final_pending") return '<span class="pill p-stage">最終承認待ち</span>';
  var lane = app.lane==="priority" ? '<span class="pill p-auto">優先レーン</span>' : '<span class="pill p-review">通常レビュー</span>';
  return lane+' <span class="pill p-new">一次確認待ち</span>';
}

function profileScore100(p){
  var items = [];
  var bio = p.bio||"";
  var bioGot = 0, bioTips = [];
  if(bio.length>=50){ bioGot+=10; } else { bioTips.push("50文字以上にする（+10点）"); }
  if(bio.length>=100){ bioGot+=10; } else { bioTips.push("100文字以上にする（+10点）"); }
  if(/\d/.test(bio)){ bioGot+=5; } else { bioTips.push("実績や目標の数字を1つ入れる（+5点）例：歴5年・月商30万円"); }
  if(/(したい|目標|挑戦|目指)/.test(bio)){ bioGot+=5; } else { bioTips.push("「〜したい」「目標」など今後の意欲をひとこと入れる（+5点）"); }
  items.push({label:"自己紹介", got:bioGot, max:30, tips:bioTips});
  var tCnt = p.talkTags.length;
  items.push({label:"話したいトピック", got:Math.min(tCnt,5)*4, max:20, tips: tCnt>=5?[]:["あと"+(5-tCnt)+"個選ぶと満点（1個につき+4点）"]});
  var sCnt = p.skillTags.length;
  items.push({label:"力になれること", got:[0,8,14,20][Math.min(3,sCnt)], max:20, tips: sCnt>=3?[]:["3個以上選ぶと満点（現在"+sCnt+"個）"]});
  items.push({label:"プロフィール画像", got:p.photo?10:0, max:10, tips:p.photo?[]:["写真を設定する（+10点）"]});
  var snsCnt = 0;
  ["x","instagram","facebook"].forEach(function(k){ if(((p.sns&&p.sns[k])||"").trim()){ snsCnt++; } });
  items.push({label:"SNSリンク", got:snsCnt>=2?10:(snsCnt===1?5:0), max:10, tips:snsCnt>=2?[]:["SNSを2つ以上登録すると満点（1つで+5点）"]});
  var nm = (p.name||"").trim();
  var nGot = nm ? (/[\s　]/.test(nm)?10:5) : 0;
  items.push({label:"名前", got:nGot, max:10, tips:nGot===10?[]:["姓と名の間にスペースを入れたフルネームにする"]});
  var total = 0;
  for(var i=0;i<items.length;i++){ total += items[i].got; }
  return {total:total, items:items};
}

function saveProfile(){

    '<p>申請内容は本人と事務局スタッフが確認します。マッチの成立はスタッフが判断し、成立後に連絡先が開示されます。</p>'+
    '<label>相談したい内容（テーマは1つに絞ると成立しやすくなります）</label>'+
    '<textarea id="applyBody">'+esc("現在◯◯に取り組んでおり、"+ (target.skillTags[0]||"") +"について30分ご相談したいです。数字や資料は事前に共有します。")+'</textarea>'+
    '<label>希望する形式</label>'+
    '<select id="applyWish"><option>オンライン30分</option><option>オンライン60分</option><option>チャット</option></select>'+
    '<div class="autobox">🤖 <b>自動運用ポイント</b>：送信すると100点ルーブリックで事前チェックし、'+state.cfg.priorityMin+'点以上は優先レーン、'+state.cfg.reviewMin+'〜'+(state.cfg.priorityMin-1)+'点は通常レビューへ。連絡先の直書きや勧誘表現はその場で差し戻します。</div>'+
    '<div class="actions"><button class="btn" onclick="closeModal()">やめる</button><button class="btn primary" onclick="submitApplication()">申請する</button></div>';
  openModal(h);
}
function submitApplication(){
  var me = myMember();
  var target = memberById(applyTargetId);
  var body = byId("applyBody").value||"";
  var wish = byId("applyWish").value;
  if(body.trim().length<10){ toast("相談したい内容をもう少し具体的に書いてください","warn"); return; }
  var hard = hardCheck(body);
  var scores = hard.length>0 ? null : scoreApplication(me, target, body);
  var total = totalScore(scores);
  var route = routeApplication(total, hard);
  var newId = "app_u"+(state.apps.length+1);
  var status, lane;
  if(route==="reject"){
    status = "done_reject"; lane = "reject";
  } else {
    status = "primary_pending"; lane = route;
  }
  var a = mkApp(newId, me.id, target.id, body, wish, nowStr(), scores, hard, status, lane, {});
  if(route==="reject"){
    a.decidedAt = nowStr();
    a.rejectReason = hard.length>0 ?
      "ハード違反により点数無効・自動差し戻し。連絡先交換はマッチ成立後に事務局経由で行われます。" :
      "自動差し戻し：合計"+total+"点。目的とテーマを絞って再申請してください。";
  }
  state.apps.push(a);
  if(route==="reject"){
    state.timeline.push(ev(nowStr(),"reject",me.name+"さんの申請を自動差し戻し"+(hard.length>0?"（ハード違反）":"（"+total+"点・基準未達）")));
    if(hard.length>0){
      state.knowledge.push(kn("kn_u"+(state.knowledge.length+1), true, "ハード違反の申請を自動差し戻し", me.name+"さんから"+target.name+"さんへの申請に「"+hard.join("・")+"」が含まれたため自動差し戻し。類似申請には警告を表示。", nowStr().slice(0,10)));
    }
  } else {
    state.timeline.push(ev(nowStr(),"review",me.name+"さんから"+target.name+"さんへ話したい申請（"+total+"点・"+(lane==="priority"?"優先レーン":"通常レビュー")+"）→ 一次確認待ち"));
  }
  saveState(); closeModal(); currentTab="m2"; render();
  if(route==="reject"){ toast("申請は差し戻しになりました。M2タブで理由を確認できます","err"); }
  else { toast("申請を受け付けました（事前チェック"+total+"点・"+(lane==="priority"?"優先レーン":"通常レビュー")+"）","ok"); }
}

/* ============ M3 承認キュー ============ */
function similarWarning(a){
  var from = memberById(a.fromId);
  for(var i=0;i<state.apps.length;i++){
    var p = state.apps[i];
    if(p.id!==a.id && p.fromId===a.fromId && p.status==="done_reject"){
      return '<div class="warn">⚠ 類似案件警告：'+esc(from.name)+'さんは過去に差し戻し履歴があります。人間対応推奨（差し戻しナレッジを確認してください）。</div>';
    }
  }
  return "";
}
function queueActions(a){
  var h = similarWarning(a);
  if(a.status==="primary_pending"){
    if(currentOp==="staff"){
      h += '<div class="actions"><button class="btn primary sm" onclick="openPrimaryModal(\''+a.id+'\')">一次確認してマッチ案を作成</button>'+
        '<button class="btn danger sm" onclick="openRejectModal(\''+a.id+'\')">差し戻し</button></div>';
    } else if(currentOp==="director"){
      h += '<div class="locknote">この案件は一次確認待ちです。'+esc(state.cfg.rolePrimary)+'の一次確認が完了すると最終承認できます（引き継ぎ型ゲート）。</div>';
    } else {
      h += '<div class="locknote">スタッフの確認待ちです。操作するには担当者を切り替えてください。</div>';
    }
  }
  if(a.status==="final_pending"){
    if(currentOp==="director"){
      h += '<div class="actions"><button class="btn ok sm" onclick="approveFinal(\''+a.id+'\')">最終承認（マッチ成立）</button>'+
        '<button class="btn danger sm" onclick="openRejectModal(\''+a.id+'\')">差し戻し</button></div>';
    } else if(currentOp==="staff"){
      h += '<div class="locknote">一次確認は完了しています。最終承認は'+esc(state.cfg.roleFinal)+'のみ行えます。</div>';
    } else {
      h += '<div class="locknote">'+esc(state.cfg.roleFinal)+'の最終承認待ちです。</div>';
    }
  }
  return h;
}

  h += '<div class="card"><h2>運用タイムライン</h2><div class="desc">直近の自動処理とスタッフ操作の履歴です。</div><div class="tl">';
  var tls = state.timeline.slice().reverse();
  for(var j=0;j<tls.length;j++){
    h += '<div class="ev '+esc(tls[j].kind)+'"><div class="t">'+esc(tls[j].at)+'</div>'+esc(tls[j].text)+'</div>';
  }
  h += '</div></div>';
  return h;
}
function kpi(n,l){ return '<div class="kpi"><div class="n">'+esc(String(n))+'</div><div class="l">'+esc(l)+'</div></div>'; }

/* ============ ナレッジ ============ */
function viewKb(){
  var h = '<div class="card"><h2>📚 マッチングナレッジ</h2>'+
    '<div class="desc">成立事例と差し戻し事例を資産化。差し戻しナレッジは、類似申請への警告表示にも使われます。</div>'+
    '<div class="autobox">🤖 <b>自動運用ポイント</b>：マッチ成立・差し戻しのたびに自動でナレッジ化。スタッフの判断基準が属人化せず、新しいスタッフでも同じ物差しで運用できます。</div></div>';
  var oks = state.knowledge.filter(function(x){ return !x.rej; });
  var ngs = state.knowledge.filter(function(x){ return x.rej; });
  h += '<div class="card"><h2>成立ナレッジ<span class="pill p-auto" style="margin-left:8px">'+oks.length+'件</span></h2>';
  for(var i=oks.length-1;i>=0;i--){ h += knItem(oks[i]); }
  h += '</div>';
  h += '<div class="card"><h2>差し戻しナレッジ（人間対応推奨の判定元）<span class="pill p-reject" style="margin-left:8px">'+ngs.length+'件</span></h2>';
  for(var j=ngs.length-1;j>=0;j--){ h += knItem(ngs[j]); }
  h += '</div>';
  return h;
}
function knItem(x){
  return '<div class="item kn'+(x.rej?" rej":"")+'"><div class="top"><div class="ttl">'+esc(x.title)+'</div><div class="meta">'+esc(x.at)+'</div></div>'+
    '<div class="knbody">'+esc(x.body)+'</div></div>';
}

/* ============ 設定 ============ */
function viewCfg(){
  var c = state.cfg;
  var h = '<div class="card"><h2>⚙️ 設定（変更は即・全画面に反映）</h2>'+
    '<div class="desc">閾値・上限・担当ロールをUIから変更できます。コードの書き換えは不要です。</div>'+
    '<div class="autobox">🤖 <b>自動運用ポイント</b>：ここで変えた閾値は、次の申請の採点・振分からすぐ適用されます。担当ロール名を変えると、承認キューの表示とゲートも連動して変わります。</div>';
  h += '<div class="row"><div><label>優先レーンの閾値（この点数以上）</label><input type="number" id="cfgPriority" value="'+c.priorityMin+'" min="1" max="100"></div>';
  h += '<div><label>通常レビューの下限（未満は自動差し戻し）</label><input type="number" id="cfgReview" value="'+c.reviewMin+'" min="1" max="100"></div>';
  h += '<div><label>月間申請上限（1人あたり）</label><input type="number" id="cfgLimit" value="'+c.monthlyLimit+'" min="1" max="20"></div></div>';
  h += '<div class="row"><div><label>通知先メール（事務局）</label><input type="email" id="cfgNotify" value="'+esc(c.notifyTo)+'"></div>';
  h += '<div><label>資格者リストの同期時刻（毎朝）</label><input type="time" id="cfgSync" value="'+esc(c.syncTime)+'"></div></div>';
  h += '<div class="row"><div><label>一次担当ロール名</label><input type="text" id="cfgRoleP" value="'+esc(c.rolePrimary)+'"></div>';
  h += '<div><label>最終承認ロール名</label><input type="text" id="cfgRoleF" value="'+esc(c.roleFinal)+'"></div></div>';
  h += '<div style="margin-top:14px"><label>ランク別の申請可否</label>';
  var rks = ["mentor","leader","crew"];
  for(var i=0;i<rks.length;i++){
    var r = rks[i];
    h += '<div class="toggleRow"><span>'+RANKS[r].label+' からの話したい申請</span><div class="toggle'+(c.rankCanApply[r]?" on":"")+'" onclick="toggleRank(\''+r+'\')"></div></div>';
  }
  h += '</div>';
  h += '<div class="actions"><button class="btn primary" onclick="saveCfg()">設定を保存する</button></div></div>';

  h += '<div class="card"><h2>資格者リスト（UMU/決済メール 突合結果）</h2>'+
    '<div class="desc">毎朝'+esc(c.syncTime)+'に自動同期される想定のリストです。モックでは手動でも追加できます。</div>';
  h += '<table><tr><th>メールアドレス</th><th>名前</th><th>資格ランク</th><th>状態</th></tr>';
  for(var j=0;j<state.qualified.length;j++){
    var q = state.qualified[j];
    h += '<tr><td>'+esc(q.email)+'</td><td>'+esc(q.name)+'</td><td><span class="pill '+RANKS[q.rank].pill+'">'+RANKS[q.rank].label+'</span></td><td class="meta">'+esc(q.source)+'</td></tr>';
  }
  h += '</table>';
  h += '<div class="row" style="margin-top:12px"><div><label>メールアドレス</label><input type="email" id="qEmail" value="arata.fuyutsuki@example.jp"></div>'+
    '<div><label>名前</label><input type="text" id="qName" value="冬月 新"></div>'+
    '<div><label>資格ランク</label><select id="qRank"><option value="crew">クルー</option><option value="leader">リーダー</option><option value="mentor">メンター</option></select></div></div>'+
    '<div class="actions"><button class="btn sm" onclick="addQualified()">資格者を追加（手動）</button></div></div>';
  return h;
}
function toggleRank(r){
  state.cfg.rankCanApply[r] = !state.cfg.rankCanApply[r];
  saveState(); render();
  toast(RANKS[r].label+"からの申請を"+(state.cfg.rankCanApply[r]?"受付再開":"停止")+"しました");
}
function saveCfg(){
  var c = state.cfg;
  var pv = parseInt(byId("cfgPriority").value,10);
  var rv = parseInt(byId("cfgReview").value,10);
  if(isNaN(pv)||isNaN(rv)||pv<=rv){ toast("優先レーンの閾値は通常レビュー下限より大きくしてください","warn"); return; }
  c.priorityMin = pv; c.reviewMin = rv;
  c.monthlyLimit = Math.max(1, parseInt(byId("cfgLimit").value,10)||3);
  c.notifyTo = byId("cfgNotify").value||c.notifyTo;
  c.syncTime = byId("cfgSync").value||c.syncTime;
  c.rolePrimary = byId("cfgRoleP").value||c.rolePrimary;
  c.roleFinal = byId("cfgRoleF").value||c.roleFinal;
  saveState(); render(); toast("設定を保存しました。次の申請から新しい閾値が適用されます","ok");
}
function addQualified(){
  var email = (byId("qEmail").value||"").trim().toLowerCase();
  var name = (byId("qName").value||"").trim();
  var rank = byId("qRank").value;
  if(!email||!name){ toast("メールアドレスと名前を入力してください","warn"); return; }
  for(var i=0;i<state.qualified.length;i++){
    if(state.qualified[i].email.toLowerCase()===email){ toast("そのメールアドレスは既に登録されています","warn"); return; }
  }
  state.qualified.push({email:email, name:name, rank:rank, memberId:null, source:"手動追加（次回同期で照合）"});
  state.timeline.push(ev(nowStr(),"auto","資格者リストに"+name+"さん（"+RANKS[rank].label+"）を手動追加"));
  saveState(); render(); toast("資格者を追加しました","ok");
}

/* ============ 描画 ============ */
function renderBodyOnly(){
  var h = "";
  if(currentTab==="m1") h = viewM1();
  else if(currentTab==="m2") h = viewM2();
  else if(currentTab==="mp") h = viewMp();
  else if(currentTab==="m3") h = viewM3();
  else if(currentTab==="m4") h = viewM4();
  else if(currentTab==="kb") h = viewKb();
  else if(currentTab==="cfg") h = viewCfg();
  byId("app").innerHTML = '<div class="panel">'+h+'</div>';
  var kwInput = document.querySelector('.filterbar input[type=text]');
  if(kwInput && currentTab==="m1"){ kwInput.focus(); var v=kwInput.value; kwInput.setSelectionRange(v.length,v.length); }
}
function render(){
  if(!state.session){ renderLogin(); return; }
  renderChrome();
  renderBodyOnly();
}

loadState();
render();
</script>
</body>
</html>
