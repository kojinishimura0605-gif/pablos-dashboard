<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PABLOS メンバー名鑑 & マッチング</title>
<style>
  :root{
    --bg:#fafafa; --card:#fff; --ink:#1e2228; --sub:#5a626c; --line:#e2e6ec;
    --blue:#2563eb; --blue-bg:#eff6ff; --green:#16a34a; --green-bg:#f0fdf4;
    --amber:#d97706; --amber-bg:#fffbeb; --red:#dc2626; --red-bg:#fef2f2;
    --purple:#7c3aed; --purple-bg:#f5f3ff; --slate:#475569;
    --orange:#ea580c; --orange-bg:#fff7ed;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg); color:var(--ink); font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif; font-size:0.98rem; line-height:1.6}
  .wrap{max-width:1180px; margin:0 auto; padding:0 18px 60px}
  header.hero{background:var(--card); border-bottom:1px solid var(--line)}
  .heroband{max-width:1180px; margin:0 auto; padding:16px 18px; display:flex; flex-wrap:wrap; align-items:center; gap:14px; justify-content:space-between}
  .heroband h1{font-size:1.25rem; margin:0}
  .heroband .lead{color:var(--sub); font-size:0.92rem; margin-top:2px}
  .btn{font-family:inherit; font-size:0.95rem; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px; border-radius:9px; cursor:pointer; transition:.12s}
  .btn:hover{border-color:var(--slate)}
  .btn.primary{background:var(--blue); color:#fff; border-color:var(--blue)}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.ghost{background:transparent}
  .btn.danger{background:var(--red); color:#fff; border-color:var(--red)}
  .btn.ok{background:var(--green); color:#fff; border-color:var(--green)}
  .btn:disabled{opacity:.45; cursor:not-allowed}
  .btn.sm{padding:5px 10px; font-size:0.88rem; border-radius:7px}
  nav.tabs{position:sticky; top:0; z-index:20; background:var(--card); border-bottom:1px solid var(--line); box-shadow:0 1px 3px rgba(0,0,0,.03)}
  .tabsInner{max-width:1180px; margin:0 auto; display:flex; gap:4px; padding:6px 12px; overflow-x:auto}
  .tab{font-size:0.95rem; border:none; background:transparent; color:var(--sub); padding:10px 14px; cursor:pointer; border-radius:8px; white-space:nowrap; font-family:inherit}
  .tab:hover{background:var(--bg)}
  .tab.active{color:var(--blue); background:var(--blue-bg); font-weight:700}
  .card{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:18px; margin-top:16px}
  .card h2{font-size:1.12rem; margin:0 0 4px}
  .card .desc{color:var(--sub); font-size:0.92rem; margin-bottom:6px}
  .autobox{background:#f8fbff; border:1px solid #dbe6fb; border-left:4px solid var(--blue); border-radius:10px; padding:11px 14px; margin:12px 0; font-size:0.92rem; color:#33507f}
  .autobox b{color:var(--blue)}
  .grid{display:grid; gap:12px}
  .g2{grid-template-columns:1fr 1fr}
  .g6{grid-template-columns:repeat(6,1fr)}
  @media(max-width:820px){.g2,.g6{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:11px; padding:14px}
  .kpi .n{font-size:1.7rem; font-weight:800}
  .kpi .l{color:var(--sub); font-size:0.88rem}
  .item{border:1px solid var(--line); border-radius:11px; padding:14px; margin-top:10px; background:var(--card)}
  .item .top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap}
  .item .ttl{font-weight:700; font-size:1.02rem}
  .meta{color:var(--sub); font-size:0.85rem; margin-top:2px}
  .pill{display:inline-block; font-size:0.78rem; padding:3px 9px; border-radius:999px; font-weight:700}
  .p-auto{background:var(--green-bg); color:var(--green)}
  .p-review{background:var(--amber-bg); color:var(--amber)}
  .p-reject{background:var(--red-bg); color:var(--red)}
  .p-new{background:var(--purple-bg); color:var(--purple)}
  .p-stage{background:var(--blue-bg); color:var(--blue)}
  .p-mentor{background:var(--purple-bg); color:var(--purple)}
  .p-leader{background:var(--blue-bg); color:var(--blue)}
  .p-crew{background:var(--green-bg); color:var(--green)}
  .p-osusume{background:var(--orange-bg); color:var(--orange)}
  .p-rich{background:#fef9c3; color:#a16207}
  .pbar{height:12px; background:var(--line); border-radius:999px; overflow:hidden; margin:10px 0}
  .pbar>div{height:100%; border-radius:999px; transition:width .25s ease}
  .scorebar{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .sc{flex:1; min-width:90px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:0.82rem; color:var(--sub)}
  .sc b{display:block; color:var(--ink); font-size:1.02rem}
  .total{font-size:1.5rem; font-weight:800}
  .hardflag{background:var(--red-bg); border:1px solid #f3c2c2; border-radius:8px; padding:8px 11px; margin-top:10px; color:var(--red); font-size:0.88rem}
  .actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
  label{display:block; font-size:0.86rem; color:var(--sub); margin:10px 0 4px}
  input[type=text],input[type=email],input[type=number],textarea,select{width:100%; font-family:inherit; font-size:0.95rem; padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink)}
  textarea{min-height:78px; resize:vertical}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row>div{flex:1; min-width:180px}
  .tl{border-left:2px solid var(--line); margin-left:8px; padding-left:16px}
  .tl .ev{position:relative; padding:7px 0}
  .tl .ev::before{content:""; position:absolute; left:-23px; top:12px; width:10px; height:10px; border-radius:50%; background:var(--slate)}
  .tl .ev.auto::before{background:var(--green)} .tl .ev.review::before{background:var(--amber)} .tl .ev.reject::before{background:var(--red)}
  .tl .t{font-size:0.8rem; color:var(--sub)}
  .toggleRow{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line)}
  .toggle{position:relative; width:44px; height:24px; border-radius:999px; background:var(--line); cursor:pointer; transition:.15s}
  .toggle.on{background:var(--green)}
  .toggle::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:.15s}
  .toggle.on::after{left:23px}
  .warn{background:var(--amber-bg); border:1px solid #f2dca0; border-radius:8px; padding:8px 11px; font-size:0.86rem; color:#8a5a00; margin-top:8px}
  .locknote{color:var(--sub); font-size:0.86rem; background:var(--bg); border:1px dashed var(--line); border-radius:8px; padding:8px 11px; margin-top:10px}
  .kn{border-left:4px solid var(--green)}
  .kn.rej{border-left-color:var(--red)}
  .knbody{font-size:0.95rem; color:#3a4048; margin-top:6px}
  .hidden{display:none !important}
  .mcard{border:1px solid var(--line); border-radius:13px; padding:16px; background:var(--card)}
  .mhead{display:flex; gap:12px; align-items:center}
  .avatar{width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.15rem; color:#fff; flex-shrink:0; overflow:hidden}
  .avatar img{width:100%; height:100%; object-fit:cover}
  .av-mentor{background:var(--purple)} .av-leader{background:var(--blue)} .av-crew{background:var(--green)}
  .mname{font-weight:800; font-size:1.05rem}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
  .chip{display:inline-block; font-size:0.82rem; padding:4px 11px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink)}
  .chip.talk{border-color:#bfe3cb; background:var(--green-bg); color:#166534}
  .chip.skill{border-color:#f6d4b5; background:var(--orange-bg); color:#9a3412}
  .chip.pick{cursor:pointer; user-select:none}
  .chip.pick:hover{border-color:var(--slate)}
  .chip.pick.on-talk{background:var(--green); border-color:var(--green); color:#fff}
  .chip.pick.on-skill{background:var(--orange); border-color:var(--orange); color:#fff}
  .bio{font-size:0.95rem; color:#3a4048; margin-top:10px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px}
  .tagGroupLabel{font-size:0.82rem; color:var(--sub); margin:12px 0 6px}
  .counter{float:right; font-size:0.8rem; color:var(--sub); font-weight:400}
  .helper{font-size:0.82rem; color:var(--sub); margin-top:4px}
  .filterbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px}
  .filterbar .seg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden}
  .filterbar .seg button{border:none; background:var(--card); font-family:inherit; font-size:0.9rem; padding:7px 13px; cursor:pointer; color:var(--sub)}
  .filterbar .seg button.on{background:var(--blue); color:#fff}
  .filterbar input[type=text]{width:220px}
  .loginWrap{max-width:560px; margin:40px auto 60px; padding:0 18px}
  .loginCard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px}
  .loginCard h2{margin:0 0 6px; font-size:1.25rem}
  .loginCard .desc{color:var(--sub); font-size:0.93rem}
  .overlay{position:fixed; inset:0; background:rgba(20,24,30,.42); display:flex; align-items:center; justify-content:center; z-index:60; padding:18px}
  .modal{background:var(--card); border-radius:14px; max-width:560px; width:100%; padding:22px; box-shadow:0 18px 50px rgba(0,0,0,.2); max-height:88vh; overflow-y:auto}
  .modal h3{margin:0 0 8px; font-size:1.1rem}
  .modal p{color:var(--sub); font-size:0.92rem; margin:0 0 12px}
  .modal .actions{justify-content:flex-end}
  .toasts{position:fixed; right:18px; bottom:18px; z-index:80; display:flex; flex-direction:column; gap:8px}
  .toast{background:var(--ink); color:#fff; padding:11px 15px; border-radius:10px; font-size:0.9rem; box-shadow:0 8px 24px rgba(0,0,0,.22); animation:slidein .18s ease}
  .toast.ok{background:var(--green)} .toast.warn{background:var(--amber)} .toast.err{background:var(--red)}
  @keyframes slidein{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .foot{color:var(--sub); font-size:0.82rem; text-align:center; margin-top:30px}
  .loading{color:var(--sub); text-align:center; padding:40px 0}
</style>
</head>
<body>
<header class="hero">
  <div class="heroband">
    <div>
      <h1>PABLOS メンバー名鑑 &amp; マッチング</h1>
      <div class="lead">メンター・リーダー・クルー資格者限定の相互発見とスタッフマッチングの場</div>
    </div>
    <div class="heroActions">
      <button class="btn ghost hidden" id="logoutBtn">ログアウト</button>
    </div>
  </div>
</header>

<nav class="tabs hidden" id="tabsNav"><div class="tabsInner" id="tabsInner"></div></nav>

<div id="loginView"></div>
<div class="wrap" id="app"></div>

<div class="foot">PABLOS メンバー名鑑 &amp; マッチング ｜ 資格者限定（会員データはログイン後にのみ表示されます）</div>

<div id="modalMount"></div>
<div class="toasts" id="toasts"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

/* ============ 接続設定 ============ */
const SB_URL = "https://uvcnckzdtczkzbtpiaus.supabase.co";
const SB_KEY = "sb_publishable_WH-NN5mkGJatLzNvHoqFiA_2FOfPBOV";
const APP_URL = "https://kojinishimura0605-gif.github.io/pablos-dashboard/matching/";
const sb = createClient(SB_URL, SB_KEY);

/* ============ 定数 ============ */
const RANKS = {
  mentor:{label:"メンター", pill:"p-mentor", av:"av-mentor"},
  leader:{label:"リーダー", pill:"p-leader", av:"av-leader"},
  crew:{label:"クルー", pill:"p-crew", av:"av-crew"}
};
const ROLE_LABEL = {member:"会員", staff:"運営スタッフ", director:"事務局長"};
const TAG_GROUPS = [
  {label:"移住・くらし", tags:["ビザ・移住手続き","教育移住・子連れ移住","現地の暮らし・生活情報","早期リタイア・FIRE","副業／複業・複数ワーカー","海外移住・二拠点生活","地方移住・田舎暮らし","住まい・不動産","子育て・家族","保険・年金・老後資金"]},
  {label:"ビジネス", tags:["起業・法人設立","税金・資産形成","投資・金融","ノマドワーク・リモート起業","店舗ビジネス","AI活用","マーケティング","経営・戦略","セールス・営業","秘書業務","デザイン","動画制作","セミナー","企画","SNS","ライティング・編集","Web制作","通訳・翻訳","士業相談（税理士・行政書士など）","人材紹介・採用","コーチング・カウンセリング","M&A","システム開発"]},
  {label:"趣味・その他", tags:["語学学習","読書","勉強法","健康法","旅行","グルメ","スポーツ・アウトドア","音楽・エンタメ","アート・ものづくり","ペット","その他"]}
];
const RUBRIC = [
  {key:"purpose", label:"目的の明確さ", max:25},
  {key:"targetFit", label:"相手選定の妥当性", max:25},
  {key:"concrete", label:"相談内容の具体性", max:20},
  {key:"manner", label:"マナー・表現", max:15},
  {key:"profile", label:"プロフィール充実度", max:15}
];
const DEFAULT_CFG = {priorityMin:80, reviewMin:60, monthlyLimit:3, rankCanApply:{mentor:true, leader:true, crew:true}};

/* ============ 状態 ============ */
let session = null;
let me = null;            // mk_qualified の自分（email/name/rank/role）
let myProfile = null;     // mk_profiles の自分
let myContact = null;     // mk_contacts の自分
let profiles = [];        // 名鑑キャッシュ
let photoUrls = {};       // profileId → 署名付き画像URL（1時間有効）
let cfg = DEFAULT_CFG;
let currentTab = "m1";
let meikanFilter = {rank:"all", kw:""};
let profDraft = null;
let pendingEmail = null;

/* ============ ユーティリティ ============ */
function esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function byId(id){ return document.getElementById(id); }
function fmtDt(s){ if(!s) return ""; const d = new Date(s); const p = n=>(n<10?"0":"")+n; return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes()); }
function toast(msg, cls){
  const t = document.createElement("div");
  t.className = "toast"+(cls?" "+cls:"");
  t.textContent = msg;
  byId("toasts").appendChild(t);
  setTimeout(()=>{ if(t.parentNode) t.parentNode.removeChild(t); }, 3800);
}
function openModal(html){ byId("modalMount").innerHTML = '<div class="overlay" id="ovl"><div class="modal" onclick="event.stopPropagation()">'+html+'</div></div>'; byId("ovl").addEventListener("click", e=>{ if(e.target.id==="ovl") closeModal(); }); }
function closeModal(){ byId("modalMount").innerHTML = ""; }
window.closeModal = closeModal;
function initialsOf(name){ return (name||"?").trim().charAt(0); }
function profById(id){ return profiles.find(p=>p.id===id) || null; }
function errMsg(e){ return (e && (e.message||e.error_description)) || "通信エラーが発生しました"; }

/* ============ AI充実度採点（100点：自己紹介30/話したい20/力になれる20/画像10/SNS10/名前10） ============ */
function profileScore100(p){
  const items = [];
  const bio = p.bio||"";
  let bioGot = 0; const bioTips = [];
  if(bio.length>=50){ bioGot+=10; } else { bioTips.push("50文字以上にする（+10点）"); }
  if(bio.length>=100){ bioGot+=10; } else { bioTips.push("100文字以上にする（+10点）"); }
  if(/\d/.test(bio)){ bioGot+=5; } else { bioTips.push("実績や目標の数字を1つ入れる（+5点）例：歴5年・月商30万円"); }
  if(/(したい|目標|挑戦|目指)/.test(bio)){ bioGot+=5; } else { bioTips.push("「〜したい」「目標」など今後の意欲をひとこと入れる（+5点）"); }
  items.push({label:"自己紹介", got:bioGot, max:30, tips:bioTips});
  const tCnt = (p.talk_tags||[]).length;
  items.push({label:"話したいトピック", got:Math.min(tCnt,5)*4, max:20, tips: tCnt>=5?[]:["あと"+(5-tCnt)+"個選ぶと満点（1個につき+4点）"]});
  const sCnt = (p.skill_tags||[]).length;
  items.push({label:"力になれること", got:[0,8,14,20][Math.min(3,sCnt)], max:20, tips: sCnt>=3?[]:["3個以上選ぶと満点（現在"+sCnt+"個）"]});
  const hasPhoto = !!(p.photo_path || p.photoDataUrl);
  items.push({label:"プロフィール画像", got:hasPhoto?10:0, max:10, tips:hasPhoto?[]:["プロフィール写真を設定する（+10点）"]});
  let snsCnt = 0;
  const sns = p.sns||{};
  ["x","instagram","facebook"].forEach(k=>{ if(((sns[k])||"").trim()) snsCnt++; });
  items.push({label:"SNSリンク", got:snsCnt>=2?10:(snsCnt===1?5:0), max:10, tips:snsCnt>=2?[]:["SNSを2つ以上登録すると満点（1つで+5点）"]});
  const nm = (p.name||"").trim();
  const nGot = nm ? (/[\s　]/.test(nm)?10:5) : 0;
  items.push({label:"名前", got:nGot, max:10, tips:nGot===10?[]:["姓と名の間にスペースを入れたフルネームにする"]});
  let total = 0; items.forEach(it=>{ total += it.got; });
  return {total, items};
}
function scorePanelHtml(p){
  const r = profileScore100(p);
  const barColor = r.total>=90 ? "var(--green)" : (r.total>=60 ? "var(--amber)" : "var(--red)");
  let h = '<h2>🤖 AI充実度採点 <span class="total" style="margin-left:6px">'+r.total+'</span><span style="font-size:0.95rem;color:var(--sub)"> / 100点</span></h2>';
  h += '<div class="pbar"><div style="width:'+r.total+'%;background:'+barColor+'"></div></div>';
  if(r.total>=90){
    h += '<div class="autobox" style="border-left-color:var(--green);background:var(--green-bg);color:#14532d">🎉 90点クリアです！名鑑のあなたのカードに「★ 充実プロフィール」バッジが表示されます。</div>';
  } else {
    h += '<div class="warn">90点まで あと'+(90-r.total)+'点。下のアドバイスの順に埋めると届きます。</div>';
  }
  h += '<div class="scorebar">';
  r.items.forEach(it=>{ h += '<div class="sc">'+esc(it.label)+'<b>'+it.got+' / '+it.max+'</b></div>'; });
  h += '</div>';
  const adv = [];
  r.items.forEach(it=>{ it.tips.forEach(tip=>adv.push("【"+it.label+"】"+tip)); });
  if(adv.length>0){
    h += '<div class="tagGroupLabel">AIからの改善アドバイス</div>';
    adv.forEach(a=>{ h += '<div class="meta" style="margin-top:4px">・'+esc(a)+'</div>'; });
  }
  h += '<div class="actions"><button class="btn sm primary" id="aiDraftBtn">AIに自己紹介のたたき台を作ってもらう</button></div>';
  h += '<div class="helper">入力のたびに自動で再採点します。この点数は話したい申請の事前チェック「プロフィール充実度（15点）」にも換算して反映されます</div>';
  return h;
}

/* ============ 申請の事前チェック ============ */
function hardCheck(text){
  const flags = [];
  if(/[\w.\-]+@[\w\-]+\.[a-z]{2,}/i.test(text) || /\d{2,4}-\d{2,4}-\d{3,4}/.test(text)){ flags.push("連絡先の直書き（メール/電話）"); }
  if(/(LINE|ライン)[^\n]{0,4}(ID|iD)/i.test(text) || /\b(ID|id)[ ：:]?[a-z0-9_.\-]{5,}/.test(text)){ flags.push("連絡先の直書き（SNSのID）"); }
  if(/(有料サロン|外部サロン|別サービス|投資に興味|必ず儲か|絶対に稼げ|紹介できます)/.test(text)){ flags.push("外部サービスへの勧誘・営業表現"); }
  if(/(バカ|無能|詐欺師)/.test(text)){ flags.push("誹謗中傷・NGワードの混入"); }
  return flags;
}
function scoreApplication(fromP, toP, body){
  const scores = {purpose:0, targetFit:0, concrete:0, manner:0, profile:0};
  const len = (body||"").length;
  scores.purpose = 10 + (len>=40?5:0) + (/(したい|ため|目標)/.test(body)?5:0) + (/(相談|壁打ち|教え|見ていただ)/.test(body)?5:0);
  let overlap = 0;
  if(fromP && toP){ (fromP.talk_tags||[]).forEach(t=>{ if((toP.skill_tags||[]).includes(t)) overlap++; }); }
  scores.targetFit = overlap>=3?25:(overlap===2?20:(overlap===1?15:8));
  scores.concrete = 8 + (/\d/.test(body)?6:0) + (len>=80?6:0);
  scores.manner = /(至急|今すぐ|早くして)/.test(body) ? 8 : 15;
  scores.profile = fromP ? Math.round(profileScore100(fromP).total*0.15) : 0;
  return scores;
}
function totalScore(sc){ if(!sc) return 0; let t=0; for(const k in sc){ t+=sc[k]; } return t; }

async function doLoginCheck(){
  const email = (byId("loginEmail").value||"").trim().toLowerCase();
  if(!email || email.indexOf("@")<0){ toast("メールアドレスを入力してください","warn"); return; }
  byId("loginBtn").disabled = true;
  try{
    const {data, error} = await sb.rpc("mk_check_qualified", {p_email: email});
    if(error) throw error;
    if(!data){
      openModal('<h3>資格者リストに見つかりません</h3><p>'+esc(email)+' は資格者リスト（顧客DBマスター基準・毎朝同期）に登録がありません。UMU・決済でご利用のメールアドレスをご確認のうえ、心当たりがある場合はPABLOS事務局までご連絡ください。</p>'+
        '<div class="actions"><button class="btn primary" onclick="closeModal()">閉じる</button></div>');
      return;
    }
    const {error: otpErr} = await sb.auth.signInWithOtp({email, options:{shouldCreateUser:true, emailRedirectTo: APP_URL}});
    if(otpErr) throw otpErr;
    pendingEmail = email;
    renderLogin();
    toast("確認コードを送信しました。メールをご確認ください","ok");
  }catch(e){
    toast(errMsg(e),"err");
  }finally{
    const b = byId("loginBtn"); if(b) b.disabled = false;
  }
}
async function doVerifyOtp(){
  const token = (byId("otpInput").value||"").trim();
  if(token.length<6){ toast("6桁の確認コードを入力してください","warn"); return; }
  byId("otpBtn").disabled = true;
  try{
    const {error} = await sb.auth.verifyOtp({email: pendingEmail, token, type:"email"});
    if(error) throw error;
    pendingEmail = null;
  }catch(e){
    toast("コードが確認できませんでした："+errMsg(e),"err");
    const b = byId("otpBtn"); if(b) b.disabled = false;
  }
}

    '<label>相談したい内容（テーマは1つに絞ると成立しやすくなります）</label>'+
    '<textarea id="applyBody">'+esc("現在◯◯に取り組んでおり、"+((target.skill_tags||[])[0]||"")+"について30分ご相談したいです。数字や資料は事前に共有します。")+'</textarea>'+
    '<label>希望する形式</label>'+
    '<select id="applyWish"><option>オンライン30分</option><option>オンライン60分</option><option>チャット</option></select>'+

    '<div class="actions"><button class="btn" onclick="closeModal()">やめる</button><button class="btn primary" id="applySubmitBtn">申請する</button></div>';
  openModal(h);
  byId("applySubmitBtn").addEventListener("click", ()=>submitApplication(target));
}
async function submitApplication(target){
  const body = byId("applyBody").value||"";
  const wish = byId("applyWish").value;
  if(body.trim().length<10){ toast("相談したい内容をもう少し具体的に書いてください","warn"); return; }
  byId("applySubmitBtn").disabled = true;
  const hard = hardCheck(body);
  const scores = hard.length>0 ? null : scoreApplication(myProfile, target, body);
  const total = totalScore(scores);
  let lane, status, reject_reason = "", decided_at = null;
  if(hard.length>0){ lane="reject"; status="done_reject"; reject_reason="ハード違反により点数無効・自動差し戻し。連絡先交換はマッチ成立後に事務局経由で行われます。"; decided_at = new Date().toISOString(); }
  else if(total>=cfg.priorityMin){ lane="priority"; status="primary_pending"; }
  else if(total>=cfg.reviewMin){ lane="normal"; status="primary_pending"; }
  else { lane="reject"; status="done_reject"; reject_reason="自動差し戻し：合計"+total+"点。目的とテーマを絞って再申請してください。"; decided_at = new Date().toISOString(); }
  try{
    const {error} = await sb.from("mk_applications").insert({
      from_id: session.user.id, to_id: target.id, body, wish,
      scores, total, hard, lane, status, reject_reason, decided_at
    });
    if(error) throw error;
    await sb.from("mk_events").insert({kind: status==="done_reject"?"reject":"review",
      body: me.name+"さんから"+target.name+"さんへ話したい申請"+(status==="done_reject"?"（自動差し戻し）":"（"+total+"点・"+(lane==="priority"?"優先レーン":"通常レビュー")+"）")});
    closeModal(); currentTab="m2"; render();
    if(status==="done_reject"){ toast("申請は差し戻しになりました。M2タブで理由を確認できます","err"); }
    else { toast("申請を受け付けました（事前チェック"+total+"点・"+(lane==="priority"?"優先レーン":"通常レビュー")+"）","ok"); }
  }catch(e){ toast(errMsg(e),"err"); const b=byId("applySubmitBtn"); if(b) b.disabled=false; }
}

function pfPhotoPicked(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (e)=>{
    img.onload = ()=>{
      const maxSize = 384;
      const scale = Math.min(1, maxSize/Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*scale));
      const hh = Math.max(1, Math.round(img.height*scale));
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = hh;
      const ctx = cv.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, w, hh);
      ctx.drawImage(img, 0, 0, w, hh);
      cv.toBlob((blob)=>{
        if(!blob){ toast("画像を読み込めませんでした","err"); return; }
        profDraft.photoBlob = blob;
        profDraft.photoDataUrl = cv.toDataURL("image/jpeg", 0.85);
        profDraft.removePhoto = false;
        renderBody();
        toast("写真を設定しました。保存ボタンで確定します","ok");
      }, "image/jpeg", 0.85);
    };
    img.onerror = ()=>toast("画像を読み込めませんでした","err");
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

    let photoPath = myProfile ? (myProfile.photo_path||null) : null;
    if(p.removePhoto && photoPath){
      const {error: rmErr} = await sb.storage.from("avatars").remove([photoPath]);
      if(rmErr) throw rmErr;
      photoPath = null;
    }
    if(p.photoBlob){
      photoPath = session.user.id + "/avatar.jpg";
      const {error: upErr} = await sb.storage.from("avatars").upload(photoPath, p.photoBlob, {upsert:true, contentType:"image/jpeg", cacheControl:"3600"});
      if(upErr) throw upErr;
    }

      id: session.user.id, name: p.name.trim(), rank: me.rank,

      photo_path: photoPath,

    });

      id: session.user.id, email: me.email, sns: p.sns, updated_at: new Date().toISOString()

  h += '<div><label>通常レビューの下限（未満は自動差し戻し）</label><input type="number" id="cfgReview" value="'+c.reviewMin+'" min="1" max="100"></div>';
  h += '<div><label>月間申請上限（1人あたり）</label><input type="number" id="cfgLimit" value="'+c.monthlyLimit+'" min="1" max="20"></div></div>';
  h += '<div style="margin-top:14px"><label>ランク別の申請可否</label>';
  ["mentor","leader","crew"].forEach(r=>{
    h += '<div class="toggleRow"><span>'+RANKS[r].label+' からの話したい申請</span><div class="toggle'+((c.rankCanApply||{})[r]?" on":"")+'" data-ranktoggle="'+r+'"></div></div>';
  });
  h += '</div><div class="actions"><button class="btn primary" id="cfgSaveBtn">設定を保存する</button></div></div>';
  return h;
}
function bindCfg(){
  document.querySelectorAll("[data-ranktoggle]").forEach(t=>{
    t.addEventListener("click", ()=>{ const r=t.dataset.ranktoggle; cfg.rankCanApply[r]=!cfg.rankCanApply[r]; renderBody(); });
  });
  const b = byId("cfgSaveBtn");
  if(b) b.addEventListener("click", async ()=>{
    const pv = parseInt(byId("cfgPriority").value,10), rv = parseInt(byId("cfgReview").value,10);
    if(isNaN(pv)||isNaN(rv)||pv<=rv){ toast("優先レーンの閾値は通常レビュー下限より大きくしてください","warn"); return; }
    cfg.priorityMin=pv; cfg.reviewMin=rv; cfg.monthlyLimit=Math.max(1,parseInt(byId("cfgLimit").value,10)||3);
    try{
      const {error} = await sb.from("mk_settings").update({cfg}).eq("id",1);
      if(error) throw error;
      toast("設定を保存しました","ok");
    }catch(e){ toast(errMsg(e),"err"); }
  });
}

/* ============ 描画 ============ */
async function renderBody(){
  const app = byId("app");
  let h = "";
  if(currentTab==="m1") h = viewM1();
  else if(currentTab==="m2"){ app.innerHTML = '<div class="loading">読み込み中…</div>'; h = await viewM2(); }
  else if(currentTab==="mp") h = viewMp();
  else if(currentTab==="m3"){ app.innerHTML = '<div class="loading">読み込み中…</div>'; h = await viewM3(); }
  else if(currentTab==="m4"){ app.innerHTML = '<div class="loading">読み込み中…</div>'; h = await viewM4(); }
  else if(currentTab==="kb"){ app.innerHTML = '<div class="loading">読み込み中…</div>'; h = await viewKb(); }
  else if(currentTab==="cfg") h = viewCfg();
  app.innerHTML = h;
  if(currentTab==="m1") bindM1();
  if(currentTab==="mp") bindMp();
  if(currentTab==="m3") bindM3();
  if(currentTab==="cfg") bindCfg();
}
async function render(){
  if(!session){ renderLogin(); return; }
  if(!me){ return; }
  renderChrome();
  await renderBody();
}

/* ============ 起動 ============ */
byId("logoutBtn").addEventListener("click", async ()=>{ await sb.auth.signOut(); toast("ログアウトしました"); });
sb.auth.onAuthStateChange((_event, s)=>{
  const had = !!session;
  session = s;
  if(s && !me){ bootWithSession(); }
  if(!s){ me=null; myProfile=null; myContact=null; profiles=[]; if(had) renderLogin(); }
});
const {data:{session: s0}} = await sb.auth.getSession();
session = s0;
if(session){ await bootWithSession(); } else { renderLogin(); }
</script>
</body>
